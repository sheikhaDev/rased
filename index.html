<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="راصد"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f4;--cd:#fff;--tx:#10201e;--mu:#5f706d;--pr:#0b6e66;--pl:#d9f2ee;--ok:#15803d;--md:#b45309;--bd:#c62828;--ln:#dde5e3;--hd:#0b3d39;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1514;--cd:#152220;--tx:#e6f0ee;--mu:#93a8a4;--pr:#3dbdb1;--pl:#173a36;--ok:#4ade80;--md:#fbbf24;--bd:#f87171;--ln:#26403c;--hd:#06201e}}
:root[data-theme="dark"]{--bg:#0d1514;--cd:#152220;--tx:#e6f0ee;--mu:#93a8a4;--pr:#3dbdb1;--pl:#173a36;--ok:#4ade80;--md:#fbbf24;--bd:#f87171;--ln:#26403c;--hd:#06201e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.6 Tajawal,Tahoma,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{background:var(--hd);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;padding:8px 14px 0}
.lg{display:flex;align-items:baseline;gap:10px}.lg b{font-size:26px;font-weight:800;letter-spacing:0}.lg span{font-size:12px;opacity:.75}
nav{display:flex;gap:2px;margin-top:6px}nav button{flex:1;background:none;border:0;color:#fff;opacity:.7;font:inherit;font-weight:700;padding:9px 4px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{opacity:1;border-color:#5eead4}
main{max-width:920px;margin:0 auto;padding:14px}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:16px;font-weight:800}h4{margin:12px 0 6px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:110px}
select,input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:76px}
.b{background:var(--pr);color:#fff;border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}
.b.g{background:var(--pl);color:var(--pr)}.b.x{background:none;color:var(--bd);padding:4px 8px}.b.big{width:100%;padding:14px;font-size:17px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}.strip button{flex:none;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:20px;padding:6px 12px;font:inherit;cursor:pointer;white-space:nowrap}
.strip button.on{background:var(--pr);color:#fff;border-color:var(--pr)}.strip button.dn{border-color:var(--ok)}
.ind{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}.ind>span{flex:1}
.tri{display:flex;gap:4px}.tri button{width:52px;height:44px;border-radius:9px;border:1.5px solid var(--ln);background:var(--bg);color:var(--mu);font:inherit;font-weight:800;cursor:pointer}
.tri .s2.on{background:var(--ok);border-color:var(--ok);color:#fff}.tri .s1.on{background:var(--md);border-color:var(--md);color:#fff}.tri .s0.on{background:var(--bd);border-color:var(--bd);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:16px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}.chips button.on{background:var(--bd);color:#fff;border-color:var(--bd)}
.big0{font-size:34px;font-weight:800;line-height:1}.mu{color:var(--mu);font-size:13px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}.kp .c{margin:0;text-align:center}
.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.sk{padding:8px 0;border-bottom:1px solid var(--ln)}.sk .row{justify-content:space-between}.sk .row>*{flex:none;min-width:0}
.tg{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;background:var(--pl);color:var(--pr);margin:2px 0 2px 4px}.tg.r{background:#fde4e4;color:#b91c1c}
.fu{padding:9px 0;border-bottom:1px solid var(--ln)}
pre{white-space:pre-wrap;font:inherit;margin:0}.c svg{width:100%;height:auto;display:block}
.hero{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:center}@media(max-width:600px){.hero{grid-template-columns:1fr;justify-items:center}}
.kg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%}.kc{border-inline-start:5px solid var(--pr);background:var(--bg);border-radius:10px;padding:8px 12px}.kc b{display:block;font-size:26px;line-height:1.2}.kc span{font-size:12px;color:var(--mu)}
.dist{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:8px 0}.lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.tw{overflow-x:auto}table.ht{width:100%;border-collapse:collapse;font-size:13px}.ht th{color:var(--mu);font-weight:700;padding:6px;text-align:center;border-bottom:2px solid var(--ln)}.ht th:first-child,.ht td:first-child{text-align:start}.ht td{padding:5px 6px;border-bottom:1px solid var(--ln);text-align:center}.cell{display:inline-block;min-width:38px;padding:2px 6px;border-radius:7px;color:#fff;font-weight:800}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--hd);color:#fff;padding:10px 18px;border-radius:24px;opacity:0;transition:.25s;pointer-events:none;z-index:20}#toast.on{opacity:1}
@media print{header,#toast,.np{display:none!important}body::before{display:none}main{padding:0}.c{border:0}}
.ind{flex-wrap:wrap}.tri{flex-wrap:wrap;justify-content:flex-end}.tri button{width:46px;height:46px;font-size:17px;transition:transform .12s}.tri button:active{transform:scale(.86)}
.tri button.on.f{background:var(--ok);border-color:var(--ok);color:#fff}.tri button.on.m{background:var(--md);border-color:var(--md);color:#fff}.tri button.on.z{background:var(--bd);border-color:var(--bd);color:#fff}
header{background:linear-gradient(135deg,#0b3d39,#0b6e66)}.c{border-radius:16px}.b:active{transform:scale(.97)}
.bu{position:fixed;bottom:22%;font-size:30px;pointer-events:none;z-index:30;animation:up 1.2s ease-out forwards}@keyframes up{to{transform:translateY(-240px) rotate(25deg);opacity:0}}@media(prefers-reduced-motion:reduce){.bu{display:none}}
</style></head><body>
<header><div class="lg"><b>راصد</b><span>تقويم المهارات في الحصة</span></div><nav id="nav"></nav></header>
<main id="m"></main><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const KEY='rased_v4',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const e=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S,ui={tab:'rate',i:0,dr:{},dd:[],nt:'',dk:'',ai:0};
function mk(n,mx,ind,df){return{id:uid(),n,mx,ind:ind.map(a=>({id:uid(),n:a[0],w:a[1]})),df}}
function seed(){
 const sk=[mk('Microsoft Word',10,[['إنشاء جدول',3],['إضافة صفوف وأعمدة',2],['تنسيق الحدود والتظليل',3],['حفظ المستند',2]],['لم يحدد الخلايا قبل التنسيق','أخطأ في عدد الصفوف أو الأعمدة','لم يجد تبويب تخطيط الجدول','نسي حفظ المستند أو اختار موقعًا خاطئًا'])];
 
 const names=['مريم المنصورية','فاطمة البلوشية','عائشة الهنائية','سلمى الريامية','نورة الكندية','حفصة الحارثية','لجين السيابية','ريم الشكيلية'];
 const cl={id:uid(),n:'الصف الخامس / شعبة 1',st:names.map(n=>({id:uid(),n}))},sb={id:uid(),n:'تقنية المعلومات',sk};
 const ev=[];
 return{classes:[cl],subjects:[sb,...['اللغة العربية','الرياضيات','العلوم','اللغة الإنجليزية','الدراسات الاجتماعية','التربية الإسلامية'].map(n=>({id:uid(),n,sk:[],lock:1}))],ev}}
function pc(k,r){let t=0,w=0;k.ind.forEach(i=>{w+=i.w;t+=r[i.id]??0});return w?t/w:0}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(x){}if(!S||!S.classes)S=seed();ui.cid=S.classes[0]?.id;ui.sub=S.subjects[0]?.id;ui.sk=S.subjects[0]?.sk[0]?.id}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}}
function toast(t){const o=$('#toast');o.textContent=t;o.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>o.className='',1800)}
const cls=()=>S.classes.find(c=>c.id===ui.cid)||S.classes[0],sub=()=>S.subjects.find(s=>s.id===ui.sub)||S.subjects[0],
 skl=()=>{const s=sub();return s&&(s.sk.find(k=>k.id===ui.sk)||s.sk[0])},
 allSk=()=>S.subjects.flatMap(s=>s.sk),last=(sid,kid)=>{for(let i=S.ev.length-1;i>=0;i--)if(S.ev[i].sid===sid&&S.ev[i].sk===kid)return S.ev[i]},
 hist=(sid,kid)=>S.ev.filter(v=>v.sid===sid&&v.sk===kid),
 opts=(l,s,f)=>l.map(x=>`<option value="${x.id}" ${x.id===s?'selected':''}>${e(f(x))}</option>`).join(''),
 lv=p=>p>=.9?'متفوق':p>=.75?'متقن':p>=.5?'يقترب من الإتقان':'يحتاج إلى دعم',cl=p=>p>=.75?'var(--ok)':p>=.5?'var(--md)':'var(--bd)',
 f1=x=>String(Math.round(x)),pr=x=>Math.round(x*100)+'%',
 sel=(id,fn)=>`onchange="${fn}(this.value)" id="${id}"`;
function set(k,v){if(k=='sub'&&S.subjects.find(x=>x.id===v)?.lock){toast('المتاح حاليًا: تقنية المعلومات فقط');return render()}ui[k]=v;if(k=='cid'){ui.i=0}if(k=='sub'){ui.sk=sub()?.sk[0]?.id;ui.i=0}if(k=='sk')ui.i=0;render()}
function tab(t){ui.tab=t;render()}
function render(){const T={rate:'✏️ الرصد',dash:'📊 اللوحة',rep:'📄 التقارير',set:'⚙️ الإدارة'};
 $('#nav').innerHTML=Object.keys(T).map(k=>`<button class="${ui.tab==k?'on':''}" onclick="tab('${k}')">${T[k]}</button>`).join('');
 $('#m').innerHTML={rate:vRate,dash:vDash,rep:vRep,set:vSet}[ui.tab]();save()}
function pick(p){return`<div class="c np"><div class="row"><select ${sel('s1',"set.bind(0,'cid')")}>${opts(S.classes,cls()?.id,x=>x.n)}</select><select onchange="set('sub',this.value)">${opts(S.subjects,sub()?.id,x=>x.n+(x.lock?' (قريبًا)':''))}</select>${p?`<select onchange="set('sk',this.value)">${opts(sub()?.sk||[],skl()?.id,x=>x.n)}</select>`:''}</div></div>`}
const empty=t=>`<div class="c"><h3>ابدأ من هنا</h3><p class="mu">${t}</p><button class="b" onclick="tab('set')">فتح الإدارة</button></div>`;
function vRate(){const c=cls(),s=sub(),k=skl();if(!c||!s||!k||!c.st.length)return empty('أضف صفًا وطلبة ومادة ومهارة لتبدأ الرصد.');
 ui.i=Math.min(ui.i,c.st.length-1);const st=c.st[ui.i],key=st.id+k.id;if(ui.dk!==key){ui.dk=key;ui.dr={};ui.dd=[];ui.nt=''}
 const h=hist(st.id,k.id),pv=h.at(-1),p=pc(k,ui.dr),done=k.ind.every(i=>ui.dr[i.id]!=null);
 return pick(1)+`<div class="c np">
 <div class="row" style="margin-top:8px;flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${c.st.filter(x=>last(x.id,k.id)).length/c.st.length*100}%;background:var(--ok)"></i></div><span class="mu" style="flex:none;min-width:0">${c.st.filter(x=>last(x.id,k.id)).length}/${c.st.length} طالبات</span></div><div class="strip" style="margin-top:8px">${c.st.map((x,i)=>`<button class="${i==ui.i?'on':''} ${last(x.id,k.id)?'dn':''}" onclick="ui.i=${i};render()">${last(x.id,k.id)?'✓ ':''}${e(x.n.split(' ')[0])}</button>`).join('')}</div></div>
 <div class="c"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">${['🦋','🌸','🐱','🌟','🦄','🐬','🌈','🍀'][ui.i%8]} ${e(st.n)}</h3><div class="mu">${e(k.n)} · ${h.length?`التقويم رقم ${h.length+1}، آخر درجة ${f1(pv.p*k.mx)}/${k.mx}`:'أول تقويم'}</div></div>
 <div style="text-align:center;flex:none"><div class="big0" style="color:${done?cl(p):'var(--mu)'}">${done?f1(p*k.mx):'—'}</div><div class="mu">من ${k.mx}</div></div></div>
 <h4>المهارات المطلوبة</h4>${k.ind.map(i=>{const v=ui.dr[i.id],o=i.w<=5?[...Array(i.w+1).keys()]:[0,Math.round(i.w/4),Math.round(i.w/2),Math.round(i.w*3/4),i.w];return`<div class="ind"><span>${e(i.n)}<br><small class="mu">${v==null?'اختر الدرجة':'الدرجة '+v+' من '+i.w}</small></span><div class="tri">${o.map(n=>`<button class="${v===n?'on '+(n===i.w?'f':n===0?'z':'m'):''}" onclick="ui.dr['${i.id}']=${n};render()">${n}</button>`).join('')}</div></div>`}).join('')}
 <div class="row" style="margin:8px 0"><button class="b g" onclick="fullAll()">⚡ الدرجة كاملة لكل المؤشرات</button></div>
 <h4>الصعوبات التي واجهها</h4><div class="chips">${k.df.map((d,j)=>`<button class="${ui.dd.includes(d)?'on':''}" onclick="td(${j})">${e(d)}</button>`).join('')}</div>
 <input style="margin:10px 0" placeholder="ملاحظة اختيارية" value="${e(ui.nt)}" oninput="ui.nt=this.value"><button class="b big" onclick="sv()">حفظ والانتقال للتالي</button>
 <p class="mu" style="margin:8px 0 0">اضغط على الدرجة المستحقة لكل مؤشر ثم احفظ</p></div>`}
function td(j){const d=skl().df[j],x=ui.dd.indexOf(d);x<0?ui.dd.push(d):ui.dd.splice(x,1);render()}
function sv(){const c=cls(),k=skl(),st=c.st[ui.i],r={};if(!k.ind.every(i=>ui.dr[i.id]!=null))return toast('اختر درجة لكل مؤشر أولًا');k.ind.forEach(i=>r[i.id]=ui.dr[i.id]);
 burst(pc(k,r));S.ev.push({id:uid(),sid:st.id,cid:c.id,sk:k.id,dt:new Date().toISOString().slice(0,10),r,d:[...ui.dd],n:ui.nt,p:pc(k,r)});
 toast(`حُفظ: ${st.n} ← ${f1(pc(k,r)*k.mx)}/${k.mx}`);if(ui.i<c.st.length-1)ui.i++;else toast('🎉 اكتمل رصد الصف');ui.dk='';render()}
function stats(){const c=cls(),k=skl();if(!c||!k)return null;const l=c.st.map(x=>({x,v:last(x.id,k.id)})).filter(o=>o.v),
 sk=k.ind.map(i=>({i,a:l.length?l.reduce((t,o)=>t+(o.v.r[i.id]??0),0)/l.length:0,f:l.length?l.filter(o=>o.v.r[i.id]>=i.w).length/l.length:0}));
 return{c,k,l,sk,fu:l.filter(o=>o.v.p<.6).sort((a,b)=>a.v.p-b.v.p),av:l.length?l.reduce((t,o)=>t+o.v.p,0)/l.length:0,ms:l.length?l.filter(o=>o.v.p>=.8).length/l.length:0}}
function vDash(){const t=stats();if(!t)return empty('أضف صفًا وبرنامجًا أولًا.');
 if(!t.l.length)return pick(1)+`<div class="c" style="text-align:center;padding:24px"><div style="font-size:46px">📊</div><p class="mu">ستظهر النتائج هنا فور رصد أول تقويم.</p><button class="b" onclick="tab('rate')">ابدأ الرصد</button></div>`;
 const {c,k,l,sk,fu}=t,D=[0,0,0,0];l.forEach(o=>D[o.v.p>=.9?0:o.v.p>=.75?1:o.v.p>=.5?2:3]++);
 const C=['#15803d','#0d9488','#d97706','#dc2626'],N=['متفوقات','متقنات','يقتربن من الإتقان','يحتجن دعمًا'],R=52,L=2*Math.PI*R,rows=[...l].sort((a,b)=>a.v.p-b.v.p),hard=[...sk].sort((a,b)=>a.a/a.i.w-b.a/b.i.w),miss=c.st.filter(x=>!last(x.id,k.id)).map(x=>x.n.split(' ')[0]);
 return pick(1)+`<div class="c hero"><svg viewBox="0 0 140 140" style="width:170px"><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--ln)" stroke-width="14"/><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--pr)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${L*t.ms} ${L}" transform="rotate(-90 70 70)"/><text x="70" y="72" text-anchor="middle" font-size="28" font-weight="800" fill="var(--tx)">${pr(t.ms)}</text><text x="70" y="92" text-anchor="middle" font-size="11" fill="var(--mu)">نسبة الإتقان</text></svg>
 <div class="kg"><div class="kc"><b>${f1(t.av*k.mx)}<small> / ${k.mx}</small></b><span>متوسط الدرجات</span></div><div class="kc"><b>${l.length} / ${c.st.length}</b><span>طالبات تم تقويمهن</span></div><div class="kc"><b>${S.ev.filter(v=>v.cid===c.id&&v.sk===k.id).length}</b><span>تقويمات مرصودة</span></div><div class="kc" style="border-color:var(--bd)"><b style="color:var(--bd)">${fu.length}</b><span>حالات تحتاج متابعة</span></div></div></div>
 <div class="c"><h3>توزيع المستويات</h3><div class="dist">${D.map((d,i)=>`<i style="width:${d/l.length*100}%;background:${C[i]}"></i>`).join('')}</div><div class="lgd">${D.map((d,i)=>`<span><i style="background:${C[i]}"></i>${N[i]}: <b>${d}</b></span>`).join('')}</div></div>
 <div class="c"><h3>درجات الطالبات في المهارات</h3><div class="tw"><table class="ht"><tr><th>الطالبة</th>${k.ind.map(i=>`<th>${e(i.n)}<br>من ${i.w}</th>`).join('')}<th>المجموع<br>من ${k.mx}</th></tr>${rows.map(o=>`<tr><td>${e(o.x.n)}</td>${k.ind.map(i=>{const r=o.v.r[i.id]??0;return`<td><span class="cell" style="background:${cl(r/i.w)}">${r}</span></td>`}).join('')}<td><b style="color:${cl(o.v.p)}">${f1(o.v.p*k.mx)}</b></td></tr>`).join('')}</table></div>${miss.length?`<p class="mu">لم تُقوَّم بعد: ${e(miss.join('، '))}</p>`:''}</div>
 <div class="c"><h3>المهارات من الأصعب إلى الأسهل</h3>${hard.map(o=>`<div class="sk"><div class="row"><b>${e(o.i.n)}</b><span class="mu">المتوسط <b style="color:${cl(o.a/o.i.w)}">${f1(o.a)}</b> من ${o.i.w} · الدرجة الكاملة: ${pr(o.f)}</span></div><div class="bar"><i style="width:${o.a/o.i.w*100}%;background:${cl(o.a/o.i.w)}"></i></div></div>`).join('')}</div>
 <div class="c"><h3>طالبات يحتجن إلى متابعة</h3>${fu.length?fu.map(({x,v})=>`<div class="fu"><div class="row" style="justify-content:space-between"><b>${e(x.n)}</b><span style="color:var(--bd);font-weight:800">${f1(v.p*k.mx)} / ${k.mx}</span></div>${k.ind.filter(i=>v.r[i.id]<i.w).map(i=>`<span class="tg r">${e(i.n)}: ${v.r[i.id]}/${i.w}</span>`).join('')}${v.d.map(d=>`<span class="tg">${e(d)}</span>`).join('')}</div>`).join(''):'<p class="mu">لا توجد حالات دون 60%.</p>'}</div>
